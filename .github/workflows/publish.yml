name: Publish npm
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v-package-version tag
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: npm-publish
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      commit: ${{ steps.identity.outputs.commit }}
      dist_tag: ${{ steps.identity.outputs.dist_tag }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve trusted release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          commit=$(git rev-parse --verify "refs/tags/$RELEASE_TAG^{commit}")
          git merge-base --is-ancestor "$commit" "origin/$DEFAULT_BRANCH"
          git checkout --detach "$commit"
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - id: identity
        run: node scripts/validate-release.mjs
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          EXPECTED_REPO: ${{ github.repository }}
      - run: npm ci
      - run: npm run check
      - run: npm run package:check
      - run: npm pack --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: '*.tgz'
  publish:
    needs: verify
    environment: npm
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: package
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Publish verified archive via OIDC
        run: npm publish ./package/*.tgz --ignore-scripts --provenance --access public --tag "$DIST_TAG"
        env:
          DIST_TAG: ${{ needs.verify.outputs.dist_tag }}
